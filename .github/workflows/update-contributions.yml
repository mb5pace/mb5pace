name: Update contribution rings

on:
  workflow_dispatch:
  schedule:
    # 05:30 IST every day
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-rings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image generator dependency
        run: python -m pip install --upgrade Pillow

      - name: Fetch public GitHub contribution data
        env:
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
          GITHUB_USERNAME: mb5pace
        run: node scripts/fetch-github.mjs

      - name: Generate animated contribution rings
        run: python scripts/generate-round-the-year.py

      - name: Commit refreshed data and animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json assets/round-the-year.gif assets/round-the-year-v1.0.png
          if git diff --cached --quiet; then
            echo "Contribution rings are already up to date."
          else
            git commit -m "chore: refresh contribution rings"
            git push
          fi
